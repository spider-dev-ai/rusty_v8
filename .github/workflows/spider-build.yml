name: spider-build

on:
  push:
    branches: ["spider/**"]

permissions:
  contents: read

jobs:
  build:
    name: release ${{ matrix.config.target }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-15
            target: aarch64-apple-darwin
            variant: release
            v8_enable_pointer_compression: false
            cargo: cargo

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            variant: release
            v8_enable_pointer_compression: false
            cargo: cargo

    env:
      V8_FROM_SOURCE: true
      CARGO_VARIANT_FLAG: --release
      CARGO_FEATURE_FLAGS: ''
      LIB_NAME: librusty_v8
      LIB_EXT: a
      FEATURES_SUFFIX: ''
      RUSTFLAGS: -D warnings

    steps:
      - name: Configure git
        run: git config --global core.symlinks true

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Install rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install nextest
        run: cargo binstall cargo-nextest --secure --locked --no-confirm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.x
          architecture: x64

      - name: Write git_submodule_status.txt
        run: git submodule status --recursive > git_submodule_status.txt

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |-
            target/sccache
            target/*/.*
            target/*/build
            target/*/deps
          key: cargo1-${{ matrix.config.target }}-${{ matrix.config.variant }}-${{ matrix.config.v8_enable_pointer_compression }}--${{ hashFiles('Cargo.lock', 'build.rs', 'git_submodule_status.txt') }}
          restore-keys: cargo1-${{ matrix.config.target }}-${{ matrix.config.variant }}-${{ matrix.config.v8_enable_pointer_compression }}--

      - name: Install and start sccache
        shell: pwsh
        env:
          SCCACHE_DIR: ${{ github.workspace }}/target/sccache
          SCCACHE_CACHE_SIZE: 256M
          SCCACHE_IDLE_TIMEOUT: 0
        run: |
          $version = "v0.8.2"
          $platform =
            @{
               "aarch64-apple-darwin"      = "aarch64-apple-darwin"
               "x86_64-unknown-linux-gnu"  = "x86_64-unknown-linux-musl"
             }['${{ matrix.config.target }}']
          $basename = "sccache-$version-$platform"
          $url = "https://github.com/mozilla/sccache/releases/download/$version/$basename.tar.gz"
          cd ~
          curl -LO $url
          tar -xzvf "$basename.tar.gz"
          . $basename/sccache --start-server
          echo "$(pwd)/$basename" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Clang
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo dd of=/etc/apt/sources.list.d/llvm-toolchain-jammy-21.list
          curl https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo dd of=/etc/apt/trusted.gpg.d/llvm-snapshot.gpg
          sudo apt-get update
          sudo apt-get -qq remove 'clang-*'
          sudo apt-get install lld-21 clang-21 clang-tools-21 clang-tidy-21 clang-format-21 libclang-21-dev -y
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> $GITHUB_ENV

      - name: Set LIBCLANG_PATH (macOS)
        if: startsWith(matrix.config.os, 'macos')
        run: |
          brew install llvm@21
          echo "LIBCLANG_PATH=$(brew --prefix llvm@21)/lib" >> $GITHUB_ENV

      - name: check rust code formatting
        run: cargo fmt --check

      - name: check c++ code formatting
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          clang-format-21 --verbose --Werror --dry-run src/*.cc src/*.hpp src/*.h

      - name: Test
        env:
          SCCACHE_IDLE_TIMEOUT: 0
        run: ${{ matrix.config.cargo }} nextest run -v --cargo-verbose --cargo-verbose --all-targets --locked --target ${{ matrix.config.target }} ${{ env.CARGO_VARIANT_FLAG }} ${{ env.CARGO_FEATURE_FLAGS }}

      - name: Clippy
        run: ${{ matrix.config.cargo }} clippy --all-targets --locked --target ${{ matrix.config.target }} ${{ env.CARGO_VARIANT_FLAG }} ${{ env.CARGO_FEATURE_FLAGS }} -- -D clippy::all

      - name: Prepare binary publish
        run: |
          gzip -9c target/${{ matrix.config.target }}/${{ matrix.config.variant }}/gn_out/obj/${{ env.LIB_NAME }}.${{ env.LIB_EXT }} > target/${{ env.LIB_NAME }}${{ env.FEATURES_SUFFIX }}_${{ matrix.config.variant }}_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz
          ls -l target/${{ env.LIB_NAME }}${{ env.FEATURES_SUFFIX }}_${{ matrix.config.variant }}_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz

          cp target/${{ matrix.config.target }}/${{ matrix.config.variant}}/gn_out/src_binding.rs target/src_binding${{ env.FEATURES_SUFFIX }}_${{ matrix.config.variant }}_${{ matrix.config.target }}.rs
          ls -l target/src_binding${{ env.FEATURES_SUFFIX }}_${{ matrix.config.variant }}_${{ matrix.config.target }}.rs

      - name: Write checksums and V8 version
        working-directory: target
        run: |
          A=librusty_v8_release_${{ matrix.config.target }}.a.gz
          B=src_binding_release_${{ matrix.config.target }}.rs
          {
            if command -v sha256sum >/dev/null; then sha256sum "$A" "$B"; else shasum -a 256 "$A" "$B"; fi
            V=v8/include/v8-version.h
            maj=$(awk '/#define V8_MAJOR_VERSION/{print $3}' ../$V)
            min=$(awk '/#define V8_MINOR_VERSION/{print $3}' ../$V)
            bld=$(awk '/#define V8_BUILD_NUMBER/{print $3}' ../$V)
            pat=$(awk '/#define V8_PATCH_LEVEL/{print $3}' ../$V)
            echo "V8 version: $maj.$min.$bld.$pat"
          } | tee checksums_release_${{ matrix.config.target }}.txt

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spider_release_${{ matrix.config.target }}
          path: |
            target/librusty_v8_release_${{ matrix.config.target }}.a.gz
            target/src_binding_release_${{ matrix.config.target }}.rs
            target/checksums_release_${{ matrix.config.target }}.txt
